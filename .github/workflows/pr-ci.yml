name: Media Factory PR controls

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  full-fresh-checkout-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up exact .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.103
      - name: Verify exact clean checkout
        shell: bash
        run: |
          test "$(dotnet --version)" = "10.0.103"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Run the full package-independent repository verification
        shell: bash
        run: bash scripts/ai/verify.sh
      - name: Audit exact contract dependencies for known vulnerabilities
        shell: bash
        run: >-
          dotnet list src/Chummer.Media.Factory.Runtime/Chummer.Media.Factory.Runtime.csproj
          package --vulnerable --include-transitive --no-restore
