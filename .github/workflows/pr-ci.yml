name: Media Factory PR controls

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts-release-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up exact .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.103
      - name: Verify release authority and spatial freeze policy
        shell: bash
        run: |
          test "$(dotnet --version)" = "10.0.103"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 -m unittest \
            tests/test_release_snapshot_compatibility.py \
            tests/test_governed_spatial_freeze.py
      - name: Build and exercise the public projection consumer
        shell: bash
        run: >-
          dotnet run
          --project tests/MediaPublicationAuthoritySmoke/Chummer.Media.PublicationAuthoritySmoke.csproj
          --configuration Release --nologo
      - name: Prove unlicensed package publication stays blocked
        shell: bash
        run: |
          package_dir="${RUNNER_TEMP}/media-contract-package-gate"
          mkdir -p "${package_dir}"
          dotnet pack src/Chummer.Media.Contracts/Chummer.Media.Contracts.csproj \
            --configuration Release --output "${package_dir}" --nologo
          test -z "$(find "${package_dir}" -maxdepth 1 -type f -name '*.nupkg' -print -quit)"
          if dotnet pack src/Chummer.Media.Contracts/Chummer.Media.Contracts.csproj \
            --configuration Release --output "${package_dir}" --nologo \
            -p:ChummerMediaPackagePublishing=true; then
            echo "unlicensed package publication unexpectedly succeeded" >&2
            exit 1
          fi
          test -z "$(find "${package_dir}" -maxdepth 1 -type f -name '*.nupkg' -print -quit)"
      - name: Audit contract dependency vulnerabilities
        shell: bash
        run: >-
          dotnet list src/Chummer.Media.Contracts/Chummer.Media.Contracts.csproj
          package --vulnerable --include-transitive
